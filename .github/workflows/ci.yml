name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server deps
        run: |
          cd server
          npm ci

      - name: Install client deps
        run: |
          cd client
          npm ci

      - name: Type-check server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Type-check client
        run: npx tsc -p client/tsconfig.app.json --noEmit

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Apply server migrations (dev SQLite) and generate client
        run: |
          cd server
          npm ci
          # try deploy, fallback to migrate dev for new setups
          npx prisma migrate deploy --schema prisma/schema.dev.prisma || npx prisma migrate dev --schema prisma/schema.dev.prisma --name ci --preview-feature
          npx prisma generate --schema prisma/schema.dev.prisma

      - name: Start server in background
        run: |
          cd server
          nohup npm run dev > server.log 2>&1 &

      - name: Wait for server to be ready
        run: |
          for i in {1..20}; do
            if curl -sSf http://localhost:5000/api/products >/dev/null; then echo 'server up'; exit 0; fi
            echo 'waiting for server...'; sleep 1;
          done
          echo 'server did not become ready' >&2; exit 1

      - name: Run e2e tests
        run: |
          cd server
          npm run e2e
